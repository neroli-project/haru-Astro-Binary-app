const ZODIAC_SIGNS = [
    { name: "白羊座", symbol: "♈", start: 0 },
    { name: "金牛座", symbol: "♉", start: 30 },
    { name: "双子座", symbol: "♊", start: 60 },
    { name: "蟹座", symbol: "♋", start: 90 },
    { name: "獅子座", symbol: "♌", start: 120 },
    { name: "乙女座", symbol: "♍", start: 150 },
    { name: "天秤座", symbol: "♎", start: 180 },
    { name: "天蠍座", symbol: "♏", start: 210 },
    { name: "人馬座", symbol: "♐", start: 240 },
    { name: "磨羯座", symbol: "♑", start: 270 },
    { name: "宝瓶座", symbol: "♒", start: 300 },
    { name: "双魚座", symbol: "♓", start: 330 }
];

function safeMod(n, m) { return ((n % m) + m) % m; }

// 黄経角度(0-360)を「双魚座20.12°」の形式に変換
function formatZodiacDegree(deg) {
    deg = safeMod(deg, 360);
    const signIdx = Math.floor(deg / 30);
    const signDeg = deg % 30;
    const degInt = Math.floor(signDeg);
    const minInt = Math.floor((signDeg - degInt) * 60);
    const sign = ZODIAC_SIGNS[signIdx];
    return `${sign.symbol} ${sign.name}${degInt}°${minInt < 10 ? '0' : ''}${minInt}' (${deg.toFixed(2)}°)`;
}

function showModal(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('customModal').classList.remove('hidden');
    document.getElementById('customModal').classList.add('flex');
}

function closeModal() {
    document.getElementById('customModal').classList.add('hidden');
    document.getElementById('customModal').classList.remove('flex');
}

function toggleTimeInput() {
    const isUnknown = document.getElementById('unknownTimeCheck').checked;
    const timeInput = document.getElementById('birthTimeInput');
    timeInput.disabled = isUnknown;
    timeInput.classList.toggle('opacity-40', isUnknown);
}

/* Astronomy Engine による高精度黄経（Ecliptic Longitude）算出 */
function getBodyLongitude(bodyName, dateObj) {
    try {
        if (typeof Astronomy !== 'undefined' && Astronomy.Ecliptic) {
            const time = Astronomy.MakeTime(dateObj);
            const vec = Astronomy.GeoVector(bodyName, time, true);
            const ecl = Astronomy.Ecliptic(vec);
            return safeMod(ecl.elon, 360);
        }
    } catch(e) {
        console.error("Astronomy error:", bodyName, e);
    }
    return 0;
}

function getYearGanShi(targetYear) {
    const offsetYear = targetYear - 4;
    const ganIdx = safeMod(offsetYear, 10);
    const nishiIdx = safeMod(offsetYear, 12);
    return { gan: JUKKAN[ganIdx], nishi: JUNICHI[nishiIdx], name: JUKKAN[ganIdx] + JUNICHI[nishiIdx] };
}

function calculateDayPillar(dateObj) {
    const year = dateObj.getFullYear();
    const month = dateObj.getMonth() + 1;
    const day = dateObj.getDate();
    const hour = dateObj.getHours();

    let calcYear = year;
    let calcMonth = month;
    let calcDay = day;

    if (hour >= 23) {
        const nextDay = new Date(dateObj.getTime() + 24 * 60 * 60 * 1000);
        calcYear = nextDay.getFullYear();
        calcMonth = nextDay.getMonth() + 1;
        calcDay = nextDay.getDate();
    }

    if (calcMonth <= 2) {
        calcYear -= 1;
        calcMonth += 12;
    }

    const A = Math.floor(calcYear / 100);
    const B = 2 - A + Math.floor(A / 4);
    const JD = Math.floor(365.25 * (calcYear + 4716)) + Math.floor(30.6001 * (calcMonth + 1)) + calcDay + B - 1524.5;

    const ganIdx = safeMod(Math.floor(JD + 0.5) + 9, 10);
    const nishiIdx = safeMod(Math.floor(JD + 0.5) + 1, 12);

    return {
        gan: JUKKAN[ganIdx],
        nishi: JUNICHI[nishiIdx],
        name: JUKKAN[ganIdx] + JUNICHI[nishiIdx]
    };
}

function checkKuhou(dayGan, dayNishi, targetYearNishi) {
    const ganIdx = JUKKAN.indexOf(dayGan);
    const nishiIdx = JUNICHI.indexOf(dayNishi);
    const xunHeadNishiIdx = safeMod(nishiIdx - ganIdx, 12);
    const kuhou1 = JUNICHI[safeMod(xunHeadNishiIdx + 10, 12)];
    const kuhou2 = JUNICHI[safeMod(xunHeadNishiIdx + 11, 12)];
    return { isKuhouYear: (targetYearNishi === kuhou1 || targetYearNishi === kuhou2), kuhouList: [kuhou1, kuhou2] };
}

let calculatedNatalDegrees = {};

function runAnalysis() {
    const dateVal = document.getElementById('birthDateInput').value;
    const isUnknownTime = document.getElementById('unknownTimeCheck').checked;
    const timeVal = isUnknownTime ? '12:00' : (document.getElementById('birthTimeInput').value || '12:00');
    const targetYearVal = parseInt(document.getElementById('targetYearInput').value, 10);

    if (!dateVal) {
        showModal("入力エラー", "生年月日を入力してください。");
        return;
    }

    const birthDate = new Date(`${dateVal}T${timeVal}:00`);

    // 1. ネイタル天体度の計算（初回または基準値設定）
    if (!document.getElementById('natalSunDeg').value || window.lastBirthDate !== dateVal) {
        calculatedNatalDegrees = {
            "Sun": getBodyLongitude("Sun", birthDate),
            "Moon": getBodyLongitude("Moon", birthDate),
            "Mercury": getBodyLongitude("Mercury", birthDate),
            "Venus": getBodyLongitude("Venus", birthDate),
            "Mars": getBodyLongitude("Mars", birthDate)
        };

        document.getElementById('natalSunDeg').value = calculatedNatalDegrees["Sun"].toFixed(2);
        document.getElementById('natalMoonDeg').value = calculatedNatalDegrees["Moon"].toFixed(2);
        document.getElementById('natalMercuryDeg').value = calculatedNatalDegrees["Mercury"].toFixed(2);
        document.getElementById('natalVenusDeg').value = calculatedNatalDegrees["Venus"].toFixed(2);
        document.getElementById('natalMarsDeg').value = calculatedNatalDegrees["Mars"].toFixed(2);
        window.lastBirthDate = dateVal;
    } else {
        // ユーザーが手動入力した度数を反映
        calculatedNatalDegrees = {
            "Sun": parseFloat(document.getElementById('natalSunDeg').value) || 0,
            "Moon": parseFloat(document.getElementById('natalMoonDeg').value) || 0,
            "Mercury": parseFloat(document.getElementById('natalMercuryDeg').value) || 0,
            "Venus": parseFloat(document.getElementById('natalVenusDeg').value) || 0,
            "Mars": parseFloat(document.getElementById('natalMarsDeg').value) || 0
        };
    }

    // 2. 四柱推命ステータス計算
    const dayPillar = calculateDayPillar(birthDate);
    const yearGanShi = getYearGanShi(targetYearVal);
    const nikkanMap = TSUCHENSEI_MATRIX[dayPillar.gan] || {};
    const currentTheme = nikkanMap[yearGanShi.gan] || "比肩";
    const kuhouInfo = checkKuhou(dayPillar.gan, dayPillar.nishi, yearGanShi.nishi);

    // 3. 対象年のトランジット天体リアル演算 (月ごとサンプリングして精度高く検出)
    const transitPlanets = ["Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"];
    const natalPlanets = ["Sun", "Moon", "Mercury", "Venus", "Mars"];
    const detectedAspects = [];

    // 指定年の各月15日の天体位置を取得し、アスペクトを精密判定
    for (let month = 0; month < 12; month++) {
        const checkDate = new Date(Date.UTC(targetYearVal, month, 15, 12, 0, 0));
        const dateStr = `${targetYearVal}-${String(month + 1).padStart(2, '0')}-15`;

        transitPlanets.forEach(tPlanet => {
            const tDeg = getBodyLongitude(tPlanet, checkDate);

            natalPlanets.forEach(nPlanet => {
                const nDeg = calculatedNatalDegrees[nPlanet];
                let diff = Math.abs(tDeg - nDeg);
                if (diff > 180) diff = 360 - diff;

                ASPECTS_DEF.forEach(asp => {
                    const orb = Math.abs(diff - asp.angle);
                    if (orb <= asp.orb) {
                        detectedAspects.push({
                            date: dateStr,
                            tPlanet,
                            tDeg,
                            nPlanet,
                            nDeg,
                            aspect: asp,
                            orb: orb.toFixed(2),
                            diff: diff.toFixed(2)
                        });
                    }
                });
            });
        });
    }

    // 重複除去（最もオーブが近い月を抽出）
    const uniqueAspects = [];
    const aspectKeys = new Set();
    detectedAspects.sort((a, b) => parseFloat(a.orb) - parseFloat(b.orb));

    detectedAspects.forEach(item => {
        const key = `${item.tPlanet}-${item.nPlanet}-${item.aspect.name}`;
        if (!aspectKeys.has(key)) {
            aspectKeys.add(key);
            uniqueAspects.push(item);
        }
    });

    // スコアリング（オーブの近さと通変星の調和度）
    uniqueAspects.forEach(item => {
        let score = (10 - parseFloat(item.orb)) * 1.5;
        if (kuhouInfo.isKuhouYear) score *= 0.85;
        item.score = score;
    });
    uniqueAspects.sort((a, b) => b.score - a.score);

    // 4. UI 描画
    renderSummary({
        nikkan: dayPillar.gan,
        dayPillar: dayPillar.name,
        targetYear: targetYearVal,
        currentTheme,
        yearGanShi: yearGanShi.name,
        isKuhou: kuhouInfo.isKuhouYear,
        kuhouBranches: kuhouInfo.kuhouList.join('・')
    });

    renderTimeline(uniqueAspects, currentTheme, kuhouInfo.isKuhouYear);
}

                    <p class="text-slate-300 pt-0.5">${aspectEffectText}</p>

                    ${isKuhou ? '<p class="text-amber-400 text-[11px] pt-1 border-t border-amber-500/20">⚠️ <b>空亡補正:</b> 今年は空亡（リセット・内省の年）にあたるため、外側に急いで結果を求めるより、技術の研鑽や知識の蓄積など「内側の充実」に充てると大きな開運に繋がります。</p>' : ''}
                </div>
            </div>
        `;
    });

    timelineDiv.innerHTML = html;
}

window.onload = function() {
    runAnalysis();
};
</script>
